name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Force Failure
        run: go test -cover ./...

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'  # Use your project's Go version

      - name: Check code formatting
        run: |
          if ! test -z $(go fmt ./...); then
            echo "❌ Formatting issues found! Run 'go fmt ./...' to fix."
            exit 1
          fi
        shell: bash
